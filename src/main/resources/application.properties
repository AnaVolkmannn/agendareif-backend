spring.application.name=agenda-api

// Configurações do servidor OPENAPI
server.port=8081

spring.datasource.url=jdbc:postgresql://reif-agenda-db.postgres.database.azure.com:5432/reifdb?sslmode=require
spring.datasource.username=reifadmin
spring.datasource.password=${DB_PASSWORD}

azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
azure.storage.container=reif-images

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=abcdefghijklmnopqrstuvwxyzksdadd
jwt.expiration-ms=86400000

# --- E-mail (JavaMailSender) ---
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM}

app.frontend-url=${FRONTEND_URL:http://localhost:3000}

app.reminder-hours-before=3
app.reminder-check-interval-ms=60000